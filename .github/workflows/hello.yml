name: My First Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello from GitHub Actions!"

      - name: Show Date
        run: date

      - name: Show Branch
        run: echo "Current branch is $GITHUB_REF_NAME"

      - name: Show Author
        run: echo "Current author is $GITHUB_ACTOR"

      - name: Finish
        run: echo "Workflow completed successfully!"

  summary:
    runs-on: ubuntu-latest
    needs: hello
    steps:
      - name: Show Summary
        run: echo "This is the summary of the workflow."

  goodbye:
    runs-on: ubuntu-latest
    needs: summary
    steps:
      - name: Show Goodbye
        run: echo "This is the goodbye message for the workflow."
